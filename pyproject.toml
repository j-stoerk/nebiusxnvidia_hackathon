[project]
name = "chargewise-ai"
version = "0.1.0"
description = "Validated EV charging schedules with a Nebius Nemotron operations agent"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pandas>=2.2,<4",
  "ortools>=9.14,<10",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
