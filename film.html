<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ChargeWise — architecture and workflows</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0c1420;color:#edf3fa;font:14px system-ui,sans-serif}
    main{max-width:1600px;margin:auto}canvas{display:block;width:100%;aspect-ratio:16/9;background:#0c1420}
    .controls{display:flex;align-items:center;gap:14px;padding:16px 22px;border-top:1px solid #2b394a}
    button{background:#edf3fa;border:0;padding:9px 18px;color:#132130;font:inherit;cursor:pointer}
    input{flex:1;min-width:60px;accent-color:#61d5c0}output{font-variant-numeric:tabular-nums;white-space:nowrap}
    #status{padding:0 22px 14px;color:#a6b7ca;margin:0;font-size:12px}a{color:#85c7ff}
  </style>
</head>
<body>
<main>
  <canvas id="film" width="1600" height="900" aria-label="Animated architecture and workflows: validation, scheduling, independent checks, Nemotron tools and replanning"></canvas>
  <div class="controls">
    <button id="play" disabled>Loading…</button>
    <input id="seek" type="range" min="0" max="100" step="0.01" value="0" aria-label="Presentation position">
    <output id="clock">0:00 / 0:00</output>
    <button id="fullscreen" aria-label="Full screen" title="Full screen">⛶</button>
  </div>
  <p id="status">One continuous journey · silent film · <a href="VOICEOVER.txt" download>Timestamped voiceover text</a> · <a href="index.html" target="_parent">Project and downloads</a></p>
</main>
<script type="module" src="film.js"></script>
</body>
</html>
