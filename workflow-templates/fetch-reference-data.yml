name: Fetch reference data
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python scripts/prepare_data.py --sources nlr nasa --export-reference
      - run: python scripts/validate_data.py --external
      - uses: actions/upload-artifact@v7
        with:
          name: reference-demo-data
          path: data/reference/
          retention-days: 7
          if-no-files-found: error
