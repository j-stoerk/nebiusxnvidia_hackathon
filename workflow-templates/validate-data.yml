name: Validate data
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python scripts/validate_data.py
      - run: python scripts/prepare_data.py
      - run: git diff --exit-code -- data/demo
